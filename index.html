<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111511" />
    <meta name="description" content="DayFlow — Plan your day. Improve yourself." />
    <title>DayFlow — Plan your day. Improve yourself.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        const root = document.getElementById('root')
        const appUrl = 'http://127.0.0.1:5173/'
        const showStartup = (title, details) => {
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#111511;color:#e8ebe4;font:15px Segoe UI,sans-serif;text-align:center"><div><p style="color:#c6ef6c;font-size:11px;font-weight:700;letter-spacing:.12em">DAYFLOW</p><h1 style="font-size:28px;font-weight:500"></h1><p style="max-width:380px;color:#a5ada0;line-height:1.7"></p></div></main>'
          root.querySelector('h1').textContent = title
          root.querySelector('main p:last-child').textContent = details
        }

        showStartup('Opening DayFlow...', 'Connecting to the local app.')
        fetch(appUrl, { mode: 'no-cors' })
          .then(() => window.location.replace(appUrl))
          .catch(() => showStartup('DayFlow server is off', 'Open a terminal in this folder, run npm run dev, then open the local URL Vite prints.'))
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
